<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-Ink Uploader</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#2a2f3a;--txt:#e8eaf0;--mut:#8a91a0;--acc:#4f8cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px system-ui,sans-serif;display:flex;justify-content:center;padding:20px}
.wrap{width:100%;max-width:560px}
h1{font-size:20px;margin:0 0 4px}
p.s{color:var(--mut);margin:0 0 16px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
#drop{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--mut);cursor:pointer}
#drop.on{border-color:var(--acc);color:var(--txt)}
canvas{width:100%;image-rendering:pixelated;background:#fff;border-radius:6px;display:block}
label{display:flex;justify-content:space-between;align-items:center;margin:10px 0 4px;color:var(--mut);font-size:13px}
input[type=range]{width:100%}
select,button{background:#222733;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px}
button.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
#log{font:12px ui-monospace,monospace;color:var(--mut);white-space:pre-wrap;min-height:34px}
</style>
</head>
<body>
<div class="wrap">
  <h1>E-Ink Uploader</h1>
  <p class="s">Pick a picture, preview it, send it to the display over USB. Use Chrome or Edge on a computer.</p>

  <div class="card">
    <div id="drop">Tap or drop a picture here</div>
    <input id="file" type="file" accept="image/*" hidden>
  </div>

  <div class="card">
    <canvas id="prev" width="250" height="122"></canvas>
    <label>Contrast <span id="cv">0</span></label>
    <input id="con" type="range" min="-60" max="60" value="0">
    <label>Brightness <span id="bv">0</span></label>
    <input id="bri" type="range" min="-60" max="60" value="0">
    <div class="row" style="margin-top:12px">
      <select id="size">
        <option value="250x122">250 x 122</option>
        <option value="212x104">212 x 104</option>
      </select>
      <select id="fit">
        <option value="cover">Crop to fill</option>
        <option value="contain">Fit whole picture</option>
      </select>
      <select id="red">
        <option value="0">Black / white</option>
        <option value="1">Red for warm colors</option>
      </select>
    </div>
    <div class="row" style="margin-top:8px">
      <select id="inv"><option value="0">Normal</option><option value="1">Invert</option></select>
      <select id="dith"><option value="1">Dither</option><option value="0">Sharp (no dither)</option></select>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <button id="conn">Connect Arduino</button>
      <button id="send" class="p" disabled>Send to display</button>
    </div>
    <div id="log" style="margin-top:10px">Not connected.</div>
  </div>
</div>

<script>
// ===== EDIT HERE =====
const BAUD = 115200;
// =====================
const $ = id => document.getElementById(id);
const cv = $('prev'), cx = cv.getContext('2d');
let img = null, W = 250, H = 122, black = null, redm = null;
let port = null, writer = null, reader = null;
const log = t => $('log').textContent = t;

// ---------- load picture ----------
$('drop').onclick = () => $('file').click();
$('drop').ondragover = e => { e.preventDefault(); $('drop').classList.add('on'); };
$('drop').ondragleave = () => $('drop').classList.remove('on');
$('drop').ondrop = e => { e.preventDefault(); $('drop').classList.remove('on'); load(e.dataTransfer.files[0]); };
$('file').onchange = e => load(e.target.files[0]);
function load(f) {
  if (!f) return;
  const im = new Image();
  im.onload = () => { img = im; $('drop').textContent = f.name; render(); };
  im.src = URL.createObjectURL(f);
}

// ---------- convert ----------
function render() {
  [W, H] = $('size').value.split('x').map(Number);
  cv.width = W; cv.height = H;
  $('cv').textContent = $('con').value; $('bv').textContent = $('bri').value;
  if (!img) { cx.fillStyle = '#fff'; cx.fillRect(0, 0, W, H); return; }

  // draw picture into W x H (crop or fit)
  cx.fillStyle = '#fff'; cx.fillRect(0, 0, W, H);
  const k = $('fit').value === 'cover'
    ? Math.max(W / img.width, H / img.height)
    : Math.min(W / img.width, H / img.height);
  const dw = img.width * k, dh = img.height * k;
  cx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);

  const d = cx.getImageData(0, 0, W, H), p = d.data;
  const c = +$('con').value, b = +$('bri').value;
  const f = (259 * (c + 255)) / (255 * (259 - c));
  const useRed = $('red').value === '1', inv = $('inv').value === '1', dith = $('dith').value === '1';
  const L = new Float32Array(W * H);
  redm = new Uint8Array(W * H); black = new Uint8Array(W * H);

  for (let i = 0; i < W * H; i++) {
    const r = p[i*4], g = p[i*4+1], bl = p[i*4+2];
    const mx = Math.max(r, g, bl), mn = Math.min(r, g, bl);
    if (useRed && mx > 0 && (mx - mn) / mx > 0.5 && r > 115 && r > g * 1.25) redm[i] = 1;
    let v = 0.3 * r + 0.59 * g + 0.11 * bl;
    v = f * (v - 128) + 128 + b;
    L[i] = Math.max(0, Math.min(255, v));
    if (inv) L[i] = 255 - L[i];
  }
  // Floyd-Steinberg
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, o = L[i], n = (dith ? o < 128 : o < 128) ? 0 : 255;
    black[i] = n === 0 && !redm[i] ? 1 : 0;
    if (!dith) continue;
    const e = o - n;
    if (x + 1 < W) L[i + 1] += e * 7 / 16;
    if (y + 1 < H) {
      if (x > 0) L[i + W - 1] += e * 3 / 16;
      L[i + W] += e * 5 / 16;
      if (x + 1 < W) L[i + W + 1] += e * 1 / 16;
    }
  }
  // preview
  for (let i = 0; i < W * H; i++) {
    const v = redm[i] ? [220, 0, 0] : black[i] ? [0, 0, 0] : [255, 255, 255];
    p[i*4] = v[0]; p[i*4+1] = v[1]; p[i*4+2] = v[2]; p[i*4+3] = 255;
  }
  cx.putImageData(d, 0, 0);
}
['con', 'bri', 'size', 'fit', 'red', 'inv', 'dith'].forEach(id => $(id).oninput = render);
render();

// ---------- pack bits (1 = ink, MSB first, rows padded to bytes) ----------
function pack(m) {
  const bw = Math.ceil(W / 8), out = new Uint8Array(bw * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++)
    if (m[y * W + x]) out[y * bw + (x >> 3)] |= 0x80 >> (x & 7);
  return out;
}

// ---------- USB serial ----------
$('conn').onclick = async () => {
  if (!('serial' in navigator)) { log('This browser has no Web Serial. Use Chrome or Edge on a computer.'); return; }
  try {
    if (port) { reader && await reader.cancel().catch(() => {}); writer.releaseLock(); await port.close(); port = null;
      $('conn').textContent = 'Connect Arduino'; $('send').disabled = true; log('Disconnected.'); return; }
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: BAUD });
    writer = port.writable.getWriter();
    listen();
    $('conn').textContent = 'Disconnect'; $('send').disabled = false; log('Connected. Pick a picture, then Send.');
  } catch (e) { port = null; log('Could not connect: ' + e.message); }
};
async function listen() {
  const dec = new TextDecoder(); reader = port.readable.getReader();
  try { for (;;) { const { value, done } = await reader.read(); if (done) break;
    const t = dec.decode(value).trim(); if (!t) continue;
    const m = t.match(/panel (\d+)x(\d+)/);
    if (m && [...$('size').options].some(o => o.value === m[1] + 'x' + m[2])) {
      if ($('size').value !== m[1] + 'x' + m[2]) { $('size').value = m[1] + 'x' + m[2]; render();
        log('Panel is ' + m[1] + ' x ' + m[2] + '. Size set to match. Press Send again.'); continue; } }
    log('Arduino: ' + t); } }
  catch (e) {} finally { reader.releaseLock(); reader = null; }
}
$('send').onclick = async () => {
  if (!img) { log('Pick a picture first.'); return; }
  const bk = pack(black), rd = pack(redm);
  const buf = new Uint8Array(4 + bk.length + rd.length);
  buf.set([0xAA, 0x55, W, H]); buf.set(bk, 4); buf.set(rd, 4 + bk.length);
  log('Sending ' + buf.length + ' bytes...');
  try {
    for (let i = 0; i < buf.length; i += 64) {
      await writer.write(buf.slice(i, i + 64));
      await new Promise(r => setTimeout(r, 3));   // pace the data so the Arduino never drops bytes
    }
    log('Sent. The panel takes about 15 seconds to refresh.');
  } catch (e) { log('Send failed: ' + e.message); }
};
</script>
</body>
</html>
